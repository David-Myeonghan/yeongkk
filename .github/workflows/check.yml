name: check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: 단어 검사
        id: words
        run: npm run check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
      - name: 실패 이유를 PR 댓글로
        if: failure() && steps.words.outcome == 'failure'
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file check-report.md
        env:
          GH_TOKEN: ${{ github.token }}
