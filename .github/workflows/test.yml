name: test
# PR 의 코드를 돌리는 검사. 권한은 읽기만 — 비밀·쓰기 토큰 없음.
on:
  # base 가 main 이 아닌 PR(쌓인 PR)에서도 돈다. 비밀값이 없고 읽기 권한뿐이라 어느 base 든 같다.
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm test -w api
      - run: npm run typecheck -w api
      - run: npm test -w web
      - run: npm run typecheck -w web
      - run: npm run build -w web
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 3
  # collect job 은 2부 Task 17 (collect/ 생성) 뒤에 주석을 풀어 켠다.
